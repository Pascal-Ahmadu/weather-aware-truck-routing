# AWS Amplify Hosting build spec for the React frontend (monorepo: app lives in frontend/).
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # VITE_API_BASE_URL is set in the Amplify console (Environment variables).
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
