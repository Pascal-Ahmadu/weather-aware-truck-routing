name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, api, web]
        default: all
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/aws/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write # OIDC token for assuming the AWS role
  contents: read

jobs:
  deploy:
    # Skip quietly until the OIDC role variable has been configured in repo settings.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy
        run: |
          chmod +x infra/aws/deploy.sh
          ./infra/aws/deploy.sh "${{ github.event.inputs.target || 'all' }}"

      - name: Print URLs
        run: |
          API=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='weather-routing-api'].ServiceUrl | [0]" --output text)
          APP=$(aws amplify list-apps --query "apps[?name=='weather-routing'].appId | [0]" --output text)
          {
            echo "### Deployed"
            echo "- API: https://${API}/api/health/"
            echo "- App: https://main.${APP}.amplifyapp.com"
          } >> "$GITHUB_STEP_SUMMARY"
